name: Build SMETA TJ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore working app and build APK
        run: |
          set -e

          git show fba0acfd83c023a70bd8bea8232035ee626cdd4c:.github/workflows/build-apk.yml > /tmp/working.yml

          flutter create --org tj.smetatj --project-name smeta_tj app
          cd app

          flutter pub add shared_preferences
          rm -f test/widget_test.dart

          sed -n "/cat > lib\/main.dart <<'DART'/,/^          DART$/p" /tmp/working.yml \
            | sed '1d;$d;s/^          //' > lib/main.dart

          test -s lib/main.dart

          sed -i 's/android:label="smeta_tj"/android:label="SMETA TJ"/g' android/app/src/main/AndroidManifest.xml

          flutter pub get
          flutter analyze
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMETA-TJ-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14