name: Build SMETA TJ Online APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create SMETA TJ
        env:
          SUPABASE_URL: ${{ secrets.SMETA_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SMETA_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "SMETA_SUPABASE_URL is missing"
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "SMETA_SUPABASE_PUBLISHABLE_KEY is missing"
            exit 1
          fi

          flutter create \
            --org tj.smetatj \
            --project-name smeta_tj \
            app

          cd app

          flutter pub add supabase_flutter
          flutter pub add shared_preferences

          rm -f test/widget_test.dart

          cat > lib/main.dart <<'DART'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';

          const supabaseUrl =
              String.fromEnvironment('SUPABASE_URL');

          const supabaseKey =
              String.fromEnvironment('SUPABASE_KEY');

          SupabaseClient get supabase =>
              Supabase.instance.client;

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();

            await Supabase.initialize(
              url: supabaseUrl,
              anonKey: supabaseKey,
            );

            runApp(const SmetaTJApp());
          }

          double numValue(dynamic value) {
            if (value is num) {
              return value.toDouble();
            }

            return double.tryParse(
                  value?.toString() ?? '',
                ) ??
                0;
          }

          void message(
            BuildContext context,
            String text,
          ) {
            ScaffoldMessenger.of(context)
              ..hideCurrentSnackBar()
              ..showSnackBar(
                SnackBar(
                  content: Text(text),
                ),
              );
          }

          class SmetaTJApp extends StatelessWidget {
            const SmetaTJApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'SMETA TJ',
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor:
                        const Color(0xFF123A73),
                  ),
                  scaffoldBackgroundColor:
                      const Color(0xFFF4F6F8),
                  inputDecorationTheme:
                      const InputDecorationTheme(
                    border: OutlineInputBorder(),
                  ),
                ),
                home: const AuthGate(),
              );
            }
          }

          class AuthGate extends StatelessWidget {
            const AuthGate({super.key});

            @override
            Widget build(BuildContext context) {
              return StreamBuilder<AuthState>(
                stream:
                    supabase.auth.onAuthStateChange,
                builder: (context, snapshot) {
                  final session =
                      supabase.auth.currentSession;

                  if (session == null) {
                    return const AuthPage();
                  }

                  return const MainPage();
                },
              );
            }
          }

          class AuthPage extends StatefulWidget {
            const AuthPage({super.key});

            @override
            State<AuthPage> createState() =>
                _AuthPageState();
          }

          class _AuthPageState
              extends State<AuthPage> {
            final email =
                TextEditingController();

            final password =
                TextEditingController();

            bool register = false;
            bool loading = false;

            Future<void> submit() async {
              final e = email.text.trim();
              final p = password.text.trim();

              if (e.isEmpty || p.length < 6) {
                message(
                  context,
                  'Email ва рамзи на кам аз 6 аломатро ворид кунед.',
                );
                return;
              }

              setState(() => loading = true);

              try {
                if (register) {
                  final result =
                      await supabase.auth.signUp(
                    email: e,
                    password: p,
                  );

                  if (!mounted) return;

                  if (result.session == null) {
                    message(
                      context,
                      'Сабти ном шуд. Email-ро санҷед ва тасдиқ кунед.',
                    );
                  }
                } else {
                  await supabase.auth
                      .signInWithPassword(
                    email: e,
                    password: p,
                  );
                }
              } on AuthException catch (e) {
                if (mounted) {
                  message(context, e.message);
                }
              } catch (e) {
                if (mounted) {
                  message(
                    context,
                    'Пайвастшавӣ ба сервер нашуд.',
                  );
                }
              } finally {
                if (mounted) {
                  setState(
                    () => loading = false,
                  );
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding:
                          const EdgeInsets.all(24),
                      child: ConstrainedBox(
                        constraints:
                            const BoxConstraints(
                          maxWidth: 460,
                        ),
                        child: Card(
                          child: Padding(
                            padding:
                                const EdgeInsets.all(
                              24,
                            ),
                            child: Column(
                              mainAxisSize:
                                  MainAxisSize.min,
                              crossAxisAlignment:
                                  CrossAxisAlignment
                                      .stretch,
                              children: [
                                const Icon(
                                  Icons
                                      .engineering_outlined,
                                  size: 64,
                                ),
                                const SizedBox(
                                  height: 16,
                                ),
                                const Text(
                                  'SMETA TJ',
                                  textAlign:
                                      TextAlign.center,
                                  style: TextStyle(
                                    fontSize: 32,
                                    fontWeight:
                                        FontWeight.bold,
                                  ),
                                ),
                                const SizedBox(
                                  height: 8,
                                ),
                                Text(
                                  register
                                      ? 'Сабти номи корбар'
                                      : 'Ворид шудан',
                                  textAlign:
                                      TextAlign.center,
                                ),
                                const SizedBox(
                                  height: 24,
                                ),
                                TextField(
                                  controller: email,
                                  keyboardType:
                                      TextInputType
                                          .emailAddress,
                                  decoration:
                                      const InputDecoration(
                                    labelText:
                                        'Email',
                                    prefixIcon:
                                        Icon(
                                      Icons.email_outlined,
                                    ),
                                  ),
                                ),
                                const SizedBox(
                                  height: 12,
                                ),
                                TextField(
                                  controller: password,
                                  obscureText: true,
                                  decoration:
                                      const InputDecoration(
                                    labelText:
                                        'Рамз',
                                    prefixIcon:
                                        Icon(
                                      Icons.lock_outline,
                                    ),
                                  ),
                                ),
                                const SizedBox(
                                  height: 18,
                                ),
                                FilledButton(
                                  onPressed:
                                      loading
                                          ? null
                                          : submit,
                                  child: Padding(
                                    padding:
                                        const EdgeInsets
                                            .all(14),
                                    child: loading
                                        ? const SizedBox(
                                            width: 22,
                                            height: 22,
                                            child:
                                                CircularProgressIndicator(
                                              strokeWidth:
                                                  2,
                                            ),
                                          )
                                        : Text(
                                            register
                                                ? 'Сабти ном'
                                                : 'Ворид шудан',
                                          ),
                                  ),
                                ),
                                TextButton(
                                  onPressed: loading
                                      ? null
                                      : () {
                                          setState(() {
                                            register =
                                                !register;
                                          });
                                        },
                                  child: Text(
                                    register
                                        ? 'Ҳисоб доред? Ворид шавед'
                                        : 'Ҳисоб надоред? Сабти ном',
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class MainPage extends StatefulWidget {
            const MainPage({super.key});

            @override
            State<MainPage> createState() =>
                _MainPageState();
          }

          class _MainPageState
              extends State<MainPage> {
            int index = 0;

            @override
            Widget build(BuildContext context) {
              final pages = [
                DashboardPage(
                  goEstimate: () {
                    setState(() => index = 1);
                  },
                  goPrices: () {
                    setState(() => index = 2);
                  },
                  goMarket: () {
                    setState(() => index = 3);
                  },
                ),
                const EstimatePage(),
                const PricesPage(),
                const MarketPage(),
                const ProfilePage(),
              ];

              return Scaffold(
                body: IndexedStack(
                  index: index,
                  children: pages,
                ),
                bottomNavigationBar:
                    NavigationBar(
                  selectedIndex: index,
                  onDestinationSelected:
                      (value) {
                    setState(
                      () => index = value,
                    );
                  },
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(
                        Icons.home_outlined,
                      ),
                      selectedIcon:
                          Icon(Icons.home),
                      label: 'Асосӣ',
                    ),
                    NavigationDestination(
                      icon: Icon(
                        Icons
                            .calculate_outlined,
                      ),
                      selectedIcon:
                          Icon(Icons.calculate),
                      label: 'Смета',
                    ),
                    NavigationDestination(
                      icon: Icon(
                        Icons
                            .price_check_outlined,
                      ),
                      selectedIcon:
                          Icon(
                        Icons.price_check,
                      ),
                      label: 'Нархҳо',
                    ),
                    NavigationDestination(
                      icon: Icon(
                        Icons
                            .storefront_outlined,
                      ),
                      selectedIcon:
                          Icon(
                        Icons.storefront,
                      ),
                      label: 'Маркет',
                    ),
                    NavigationDestination(
                      icon: Icon(
                        Icons.person_outline,
                      ),
                      selectedIcon:
                          Icon(Icons.person),
                      label: 'Профил',
                    ),
                  ],
                ),
              );
            }
          }

          class DashboardPage
              extends StatefulWidget {
            const DashboardPage({
              super.key,
              required this.goEstimate,
              required this.goPrices,
              required this.goMarket,
            });

            final VoidCallback goEstimate;
            final VoidCallback goPrices;
            final VoidCallback goMarket;

            @override
            State<DashboardPage> createState() =>
                _DashboardPageState();
          }

          class _DashboardPageState
              extends State<DashboardPage> {
            bool? online;

            @override
            void initState() {
              super.initState();
              checkServer();
            }

            Future<void> checkServer() async {
              try {
                await supabase
                    .from('supplier_products')
                    .select('id')
                    .limit(1);

                if (mounted) {
                  setState(
                    () => online = true,
                  );
                }
              } catch (_) {
                if (mounted) {
                  setState(
                    () => online = false,
                  );
                }
              }
            }

            Widget menuCard({
              required IconData icon,
              required String title,
              required String subtitle,
              required VoidCallback onTap,
            }) {
              return Card(
                margin: const EdgeInsets.only(
                  bottom: 12,
                ),
                child: ListTile(
                  contentPadding:
                      const EdgeInsets.all(18),
                  leading: CircleAvatar(
                    child: Icon(icon),
                  ),
                  title: Text(
                    title,
                    style: const TextStyle(
                      fontSize: 19,
                      fontWeight:
                          FontWeight.bold,
                    ),
                  ),
                  subtitle: Text(subtitle),
                  trailing: const Icon(
                    Icons.chevron_right,
                  ),
                  onTap: onTap,
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: EdgeInsets.zero,
                children: [
                  Container(
                    padding:
                        const EdgeInsets.fromLTRB(
                      24,
                      60,
                      24,
                      30,
                    ),
                    decoration:
                        const BoxDecoration(
                      gradient: LinearGradient(
                        colors: [
                          Color(0xFF123A73),
                          Color(0xFF2864A8),
                        ],
                      ),
                      borderRadius:
                          BorderRadius.vertical(
                        bottom:
                            Radius.circular(40),
                      ),
                    ),
                    child: Column(
                      crossAxisAlignment:
                          CrossAxisAlignment.start,
                      children: [
                        const Text(
                          'SMETA TJ',
                          style: TextStyle(
                            color: Colors.white,
                            fontSize: 34,
                            fontWeight:
                                FontWeight.bold,
                          ),
                        ),
                        const SizedBox(
                          height: 8,
                        ),
                        const Text(
                          'Ҳисоби дуруст. Сохтмони босифат. Тоҷикистон обод.',
                          style: TextStyle(
                            color: Colors.white,
                            fontSize: 16,
                          ),
                        ),
                        const SizedBox(
                          height: 16,
                        ),
                        Row(
                          children: [
                       