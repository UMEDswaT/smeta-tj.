name: Build SMETA TJ Working APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create working SMETA TJ
        run: |
          flutter create --org tj.smetatj --project-name smeta_tj app
          cd app
          flutter pub add shared_preferences
          printf '%s' '' | base64 -d | gzip -d > lib/main.dart
          sed -i 's/tj\.smetatj\.smeta_tj/tj.smetatj.app/g' android/app/build.gradle.kts || true
          grep -RIl 'package tj.smetatj.smeta_tj' android/app/src/main/kotlin | xargs -r sed -i 's/package tj\.smetatj\.smeta_tj/package tj.smetatj.app/g'
          sed -i 's/android:label="smeta_tj"/android:label="SMETA TJ"/g' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter analyze
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMETA-TJ-WORKING-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error