name: Build SMETA TJ Online APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter App
        env:
          SUPABASE_URL: ${{ secrets.SMETA_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SMETA_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "SMETA_SUPABASE_URL is missing"
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "SMETA_SUPABASE_PUBLISHABLE_KEY is missing"
            exit 1
          fi

          flutter create \
            --org tj.smetatj \
            --project-name smeta_tj \
            app

          cd app

          flutter pub add supabase_flutter

          rm -f test/widget_test.dart

          cp ../src/main.dart lib/main.dart

          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

          sed -i 's/android:label="smeta_tj"/android:label="SMETA TJ"/g' \
            android/app/src/main/AndroidManifest.xml

          dart format lib/main.dart

          flutter analyze

          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMETA-TJ-ONLINE-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
