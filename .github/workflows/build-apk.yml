name: Build SMETA TJ Working APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create SMETA TJ
        run: |
          flutter create --org tj.smetatj --project-name smeta_tj app
          cd app

          flutter pub add shared_preferences

          rm -f test/widget_test.dart

          cat > lib/main.dart <<'DART'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            runApp(const SmetaTJApp());
          }

          class SmetaTJApp extends StatelessWidget {
            const SmetaTJApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'SMETA TJ',
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: const Color(0xFF123A73),
                  ),
                  scaffoldBackgroundColor: const Color(0xFFF4F6F8),
                  inputDecorationTheme: const InputDecorationTheme(
                    border: OutlineInputBorder(),
                  ),
                ),
                home: const HomePage(),
              );
            }
          }

          class HomePage extends StatefulWidget {
            const HomePage({super.key});

            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            int index = 0;
            bool loading = true;

            List<Map<String, dynamic>> estimates = [];
            List<Map<String, dynamic>> prices = [];
            List<Map<String, dynamic>> sellers = [];

            @override
            void initState() {
              super.initState();
              loadData();
            }

            Future<void> loadData() async {
              final prefs = await SharedPreferences.getInstance();

              estimates = _decodeList(
                prefs.getString('estimates'),
              );
              prices = _decodeList(
                prefs.getString('prices'),
              );
              sellers = _decodeList(
                prefs.getString('sellers'),
              );

              if (mounted) {
                setState(() {
                  loading = false;
                });
              }
            }

            List<Map<String, dynamic>> _decodeList(String? raw) {
              if (raw == null || raw.isEmpty) {
                return [];
              }

              try {
                final data = jsonDecode(raw);
                if (data is List) {
                  return data
                      .map(
                        (e) => Map<String, dynamic>.from(e as Map),
                      )
                      .toList();
                }
              } catch (_) {}

              return [];
            }

            Future<void> saveData() async {
              final prefs = await SharedPreferences.getInstance();

              await prefs.setString(
                'estimates',
                jsonEncode(estimates),
              );
              await prefs.setString(
                'prices',
                jsonEncode(prices),
              );
              await prefs.setString(
                'sellers',
                jsonEncode(sellers),
              );
            }

            double get estimateTotal {
              return estimates.fold<double>(
                0,
                (sum, item) {
                  final quantity =
                      (item['quantity'] as num?)?.toDouble() ?? 0;
                  final price =
                      (item['price'] as num?)?.toDouble() ?? 0;
                  return sum + quantity * price;
                },
              );
            }

            @override
            Widget build(BuildContext context) {
              if (loading) {
                return const Scaffold(
                  body: Center(
                    child: CircularProgressIndicator(),
                  ),
                );
              }

              final pages = [
                DashboardPage(
                  estimateTotal: estimateTotal,
                  estimatesCount: estimates.length,
                  pricesCount: prices.length,
                  sellersCount: sellers.length,
                  openEstimate: () {
                    setState(() => index = 1);
                  },
                  openPrices: () {
                    setState(() => index = 2);
                  },
                  openMarket: () {
                    setState(() => index = 3);
                  },
                ),
                EstimatePage(
                  items: estimates,
                  onAdd: addEstimate,
                  onDelete: deleteEstimate,
                ),
                PricesPage(
                  prices: prices,
                  onAdd: addPrice,
                  onDelete: deletePrice,
                ),
                MarketPage(
                  sellers: sellers,
                  onAdd: addSeller,
                  onDelete: deleteSeller,
                ),
                ProfilePage(
                  estimateTotal: estimateTotal,
                  onClear: clearAllData,
                ),
              ];

              return Scaffold(
                body: IndexedStack(
                  index: index,
                  children: pages,
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: index,
                  onDestinationSelected: (value) {
                    setState(() {
                      index = value;
                    });
                  },
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home),
                      label: 'Асосӣ',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.calculate_outlined),
                      selectedIcon: Icon(Icons.calculate),
                      label: 'Смета',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.price_check_outlined),
                      selectedIcon: Icon(Icons.price_check),
                      label: 'Нархҳо',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.storefront_outlined),
                      selectedIcon: Icon(Icons.storefront),
                      label: 'Маркет',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.person_outline),
                      selectedIcon: Icon(Icons.person),
                      label: 'Профил',
                    ),
                  ],
                ),
              );
            }

            Future<void> addEstimate() async {
              final name = TextEditingController();
              final quantity = TextEditingController();
              final unit = TextEditingController(text: 'дона');
              final price = TextEditingController();

              final result =
                  await showDialog<Map<String, dynamic>>(
                context: context,
                builder: (context) {
                  return AlertDialog(
                    title: const Text('Иловаи смета'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(
                            controller: name,
                            decoration: const InputDecoration(
                              labelText: 'Номи кор ё материал',
                            ),
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: quantity,
                            keyboardType:
                                const TextInputType.numberWithOptions(
                              decimal: true,
                            ),
                            decoration: const InputDecoration(
                              labelText: 'Миқдор',
                            ),
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: unit,
                            decoration: const InputDecoration(
                              labelText: 'Воҳид',
                            ),
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: price,
                            keyboardType:
                                const TextInputType.numberWithOptions(
                              decimal: true,
                            ),
                            decoration: const InputDecoration(
                              labelText: 'Нархи 1 воҳид, сомонӣ',
                            ),
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(context);
                        },
                        child: const Text('Бекор кардан'),
                      ),
                      FilledButton(
                        onPressed: () {
                          final q = double.tryParse(
                            quantity.text.replaceAll(',', '.'),
                          );
                          final p = double.tryParse(
                            price.text.replaceAll(',', '.'),
                          );

                          if (name.text.trim().isEmpty ||
                              q == null ||
                              p == null ||
                              q < 0 ||
                              p < 0) {
                            return;
                          }

                          Navigator.pop(
                            context,
                            {
                              'name': name.text.trim(),
                              'quantity': q,
                              'unit': unit.text.trim().isEmpty
                                  ? 'дона'
                                  : unit.text.trim(),
                              'price': p,
                            },
                          );
                        },
                        child: const Text('Илова кардан'),
                      ),
                    ],
                  );
                },
              );

              if (result != null) {
                setState(() {
                  estimates.add(result);
                });
                await saveData();
              }
            }

            Future<void> deleteEstimate(int i) async {
              setState(() {
                estimates.removeAt(i);
              });
              await saveData();
            }

            Future<void> addPrice() async {
              final name = TextEditingController();
              final price = TextEditingController();
              final city = TextEditingController(text: 'Душанбе');
              final unit = TextEditingController(text: 'дона');

              final result =
                  await showDialog<Map<String, dynamic>>(
                context: context,
                builder: (context) {
                  return AlertDialog(
                    title: const Text('Нархи нав'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(
                            controller: name,
                            decoration: const InputDecoration(
                              labelText: 'Материал',
                            ),
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: price,
                            keyboardType:
                                const TextInputType.numberWithOptions(
                              decimal: true,
                            ),
                            decoration: const InputDecoration(
                              labelText: 'Нарх, сомонӣ',
                            ),
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: unit,
                            decoration: const InputDecoration(
                              labelText: 'Воҳид',
                            ),
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: city,
                            decoration: const InputDecoration(
                              labelText: 'Шаҳр / ноҳия',
                            ),
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(context);
                        },
                        child: const Text('Бекор кардан'),
                      ),
                      FilledButton(
                        onPressed: () {
                          final p = double.tryParse(
                            price.text.replaceAll(',', '.'),
                          );

                          if (name.text.trim().isEmpty ||
                              p == null ||
                              p < 0) {
                            return;
                          }

                          Navigator.pop(
                            context,
                            {
                              'name': name.text.trim(),
                              'price': p,
                              'unit': unit.text.trim(),
                              'city': city.text.trim(),
                            },
                          );
                        },
                        child: const Text('Сабт кардан'),
                      ),
                    ],
                  );
                },
              );

              if (result != null) {
                setState(() {
                  prices.add(result);
                });
                await saveData();
              }
            }

            Future<void> deletePrice(int i) async {
              setState(() {
                prices.removeAt(i);
              });
              await saveData();
            }

            Future<void> addSeller() async {
              final store = TextEditingController();
              final phone = TextEditingController(text: '+992');
              final city = TextEditingController(text: 'Душанбе');
              final category = TextEditingController();

              final result =
                  await showDialog<Map<String, dynamic>>(
                context: context,
                builder: (context) {
                  return AlertDialog(
                    title: const Text('Фурӯшандаи нав'),
                    content: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(
                            controller: store,
                            decoration: const InputDecoration(
                              labelText: 'Номи мағоза',
                            ),
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: phone,
                            keyboardType: TextInputType.phone,
                            decoration: const InputDecoration(
                              labelText: 'Телефон',
                            ),
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: city,
                            decoration: const InputDecoration(
                              labelText: 'Шаҳр / ноҳия',
                            ),
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: category,
                            decoration: const InputDecoration(
                              labelText: 'Категорияи мол',
                            ),
                          ),
                        ],
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(context);
                        },
                        child: const Text('Бекор кардан'),
                      ),
                      FilledButton(
                        onPressed: () {
                          if (store.text.trim().isEmpty) {
                            return;
                          }

                          Navigator.pop(
                            context,
                            {
                              'store': store.text.trim(),
                              'phone': phone.text.trim(),
                              'city': city.text.trim(),
                              'category': category.text.trim(),
                            },
                          );
                        },
                        child: const Text('Илова кардан'),
                      ),
                    ],
                  );
                },
              );

              if (result != null) {
                setState(() {
                  sellers.add(result);
                });
                await saveData();
              }
            }

            Future<void> deleteSeller(int i) async {
              setState(() {
                sellers.removeAt(i);
              });
              await saveData();
            }

            Future<void> clearAllData() async {
              final yes = await showDialog<bool>(
                context: context,
                builder: (context) {
                  return AlertDialog(
                    title: const Text('Тоза кардани маълумот'),
                    content: const Text(
                      'Ҳамаи смета, нарх ва фурӯшандаҳо тоза мешаванд.',
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.pop(context, false);
                        },
                        child: const Text('Не'),
                      ),
                      FilledButton(
                        onPressed: () {
                          Navigator.pop(context, true);
                        },
                        child: const Text('Ҳа'),
                      ),
                    ],
                  );
                },
              );

              if (yes == true) {
                final prefs = await SharedPreferences.getInstance();
                await prefs.clear();

                setState(() {
                  estimates.clear();
                  prices.clear();
                  sellers.clear();
                });
              }
            }
          }

          class DashboardPage extends StatelessWidget {
            const DashboardPage({
              super.key,
              required this.estimateTotal,
              required this.estimatesCount,
              required this.pricesCount,
              required this.sellersCount,
              required this.openEstimate,
              required this.openPrices,
              required this.openMarket,
            });

            final double estimateTotal;
            final int estimatesCount;
            final int pricesCount;
            final int sellersCount;
            final VoidCallback openEstimate;
            final VoidCallback openPrices;
            final VoidCallback openMarket;

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: EdgeInsets.zero,
                children: [
                  Container(
                    padding: const EdgeInsets.fromLTRB(
                      22,
                      65,
                      22,
                      30,
                    ),
                    decoration: const BoxDecoration(
                      gradient: LinearGradient(
                        colors: [
                          Color(0xFF123A73),
                          Color(0xFF2865A8),
                        ],
                      ),
                      borderRadius: BorderRadius.only(
                        bottomLeft: Radius.circular(32),
                        bottomRight: Radius.circular(32),
                      ),
                    ),
                    child: const Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          'SMETA TJ',
                          style: TextStyle(
                            color: Colors.white,
                            fontSize: 32,
                            fontWeight: FontWeight.w900,
                          ),
                        ),
                        SizedBox(height: 8),
                        Text(
                          'Ҳисоби дуруст. Сохтмони босифат. Тоҷикистон обод.',
                          style: TextStyle(
                            color: Colors.white,
                            fontSize: 15,
                          ),
                        ),
                      ],
                    ),
                  ),
                  Padding(
                    padding: const EdgeInsets.all(16),
                    child: Column(
                      children: [
                        Card(
                          child: Padding(
                            padding: const EdgeInsets.all(18),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                const Text(
                                  'Арзиши умумии смета',
                                ),
                                const SizedBox(height: 5),
                                Text(
                                  '${estimateTotal.toStringAsFixed(2)} сомонӣ',
                                  style: const TextStyle(
                                    fontWeight: FontWeight.w900,
                                    fontSize: 27,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                        const SizedBox(height: 10),
                        _ActionCard(
                          icon: Icons.calculate_outlined,
                          title: 'Сметаи ман',
                          subtitle:
                              '$estimatesCount позиция',
                          onTap: openEstimate,
                        ),
                        _ActionCard(
                          icon: Icons.price_check_outlined,
                          title: 'Нархҳои бозор',
                          subtitle:
                              '$pricesCount нарх сабт шудааст',
                          onTap: openPrices,
                        ),
                        _ActionCard(
                          icon: Icons.storefront_outlined,
                          title: 'Фурӯшандагон',
                          subtitle:
                              '$sellersCount фурӯшанда',
                          onTap: openMarket,
                        ),
                        const _AiCard(),
                      ],
                    ),
                  ),
                ],
              );
            }
          }

          class _ActionCard extends StatelessWidget {
            const _ActionCard({
              required this.icon,
              required this.title,
              required this.subtitle,
              required this.onTap,
            });

            final IconData icon;
            final String title;
            final String subtitle;
            final VoidCallback onTap;

            @override
            Widget build(BuildContext context) {
              return Card(
                margin: const EdgeInsets.only(bottom: 10),
                child: ListTile(
                  contentPadding: const EdgeInsets.all(16),
                  leading: CircleAvatar(
                    child: Icon(icon),
                  ),
                  title: Text(
                    title,
                    style: const TextStyle(
                      fontWeight: FontWeight.w800,
                    ),
                  ),
                  subtitle: Text(subtitle),
                  trailing: const Icon(
                    Icons.chevron_right,
                  ),
                  onTap: onTap,
                ),
              );
            }
          }

          class _AiCard extends StatefulWidget {
            const _AiCard();

            @override
            State<_AiCard> createState() => _AiCardState();
          }

          class _AiCardState extends State<_AiCard> {
            final question = TextEditingController();
            String answer = '';

            void ask() {
              final q = question.text.toLowerCase();

              if (q.trim().isEmpty) {
                return;
              }

              if (q.contains('фундамент') ||
                  q.contains('арматур') ||
                  q.contains('колон') ||
                  q.contains('плита') ||
                  q.contains('ригел')) {
                answer =
                    'Ин масъала ба конструксияи борбардор вобаста аст. '
                    'Андоза, арматура ё маркаи бетонро бе ҳисоби муҳандисӣ тағйир надиҳед.';
              } else if (q.contains('нарх')) {
                answer =
                    'Нархҳоро дар қисми «Нархҳо» сабт кунед. '
                    'Баъд метавонед арзиши сметаро аз рӯи нархи воқеии худ ҳисоб кунед.';
              } else if (q.contains('сарфа') ||
                  q.contains('арзон')) {
                answer =
                    'Барои сарфа аввал талафоти материал, доставка, '
                    'нархи якчанд фурӯшанда ва корҳои ғайриконструктивиро муқоиса кунед.';
              } else {
                answer =
                    'AI Engineer ҳоло дар режими офлайн аст. '
                    'Барои ҳисоб маълумоти смета ва нархҳоро истифода баред.';
              }

              setState(() {});
            }

            @override
            Widget build(BuildContext context) {
              return Card(
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Row(
                        children: [
                          Icon(Icons.auto_awesome),
                          SizedBox(width: 8),
                          Text(
                            'AI Engineer — Offline',
                            style: TextStyle(
                              fontWeight: FontWeight.w900,
                              fontSize: 17,
                            ),
                          ),
                        ],
                      ),
                      const SizedBox(height: 12),
                      TextField(
                        controller: question,
                        decoration: const InputDecoration(
                          labelText: 'Савол нависед',
                        ),
                      ),
                      const SizedBox(height: 10),
                      FilledButton(
                        onPressed: ask,
                        child: const Text('Санҷидан'),
                      ),
                      if (answer.isNotEmpty) ...[
                        const SizedBox(height: 12),
                        Text(answer),
                      ],
                    ],
                  ),
                ),
              );
            }
          }

          class EstimatePage extends StatelessWidget {
            const EstimatePage({
              super.key,
              required this.items,
              required this.onAdd,
              required this.onDelete,
            });

            final List<Map<String, dynamic>> items;
            final Future<void> Function() onAdd;
            final Future<void> Function(int) onDelete;

            @override
            Widget build(BuildContext context) {
              final total = items.fold<double>(
                0,
                (sum, item) {
                  final q =
                      (item['quantity'] as num?)?.toDouble() ?? 0;
                  final p =
                      (item['price'] as num?)?.toDouble() ?? 0;
                  return sum + q * p;
                },
              );

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Смета'),
                ),
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: onAdd,
                  icon: const Icon(Icons.add),
                  label: const Text('Илова'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(18),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            const Text('Ҷамъ'),
                            Text(
                              '${total.toStringAsFixed(2)} сомонӣ',
                              style: const TextStyle(
                                fontWeight: FontWeight.w900,
                                fontSize: 25,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 12),
                    if (items.isEmpty)
                      const Card(
                        child: Padding(
                          padding: EdgeInsets.all(20),
                          child: Text(
                            'Ҳоло смета холӣ аст. Тугмаи «Илова»-ро пахш кунед.',
                          ),
                        ),
                      ),
                    ...items.asMap().entries.map(
                      (entry) {
                        final i = entry.key;
                        final item = entry.value;

                        final q =
                            (item['quantity'] as num).toDouble();
                        final p =
                            (item['price'] as num).toDouble();

                        return Card(
                          child: ListTile(
                            title: Text(
                              item['name'].toString(),
                              style: const TextStyle(
                                fontWeight: FontWeight.w800,
                              ),
                            ),
                            subtitle: Text(
                              '$q ${item['unit']} × ${p.toStringAsFixed(2)} сомонӣ',
                            ),
                            trailing: Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                Text(
                                  '${(q * p).toStringAsFixed(2)} с.',
                                  style: const TextStyle(
                                    fontWeight: FontWeight.w900,
                                  ),
                                ),
                                IconButton(
                                  onPressed: () {
                                    onDelete(i);
                                  },
                                  icon: const Icon(
                                    Icons.delete_outline,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        );
                      },
                    ),
                    const SizedBox(height: 90),
                  ],
                ),
              );
            }
          }

          class PricesPage extends StatelessWidget {
            const PricesPage({
              super.key,
              required this.prices,
              required this.onAdd,
              required this.onDelete,
            });

            final List<Map<String, dynamic>> prices;
            final Future<void> Function() onAdd;
            final Future<void> Function(int) onDelete;

            @override
            Widget build(BuildContext context) {
              double min = 0;
              double max = 0;
              double avg = 0;

              if (prices.isNotEmpty) {
                final values = prices
                    .map(
                      (e) => (e['price'] as num).toDouble(),
                    )
                    .toList();

                min = values.reduce(
                  (a, b) => a < b ? a : b,
                );
                max = values.reduce(
                  (a, b) => a > b ? a : b,
                );
                avg =
                    values.reduce((a, b) => a + b) /
                        values.length;
              }

              return Scaffold(
                appBar: AppBar(
                  title: const Text('Нархҳо'),
                ),
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: onAdd,
                  icon: const Icon(Icons.add),
                  label: const Text('Нарх'),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    Row(
                      children: [
                        Expanded(
                          child: _StatBox(
                            title: 'MIN',
                            value: min,
                          ),
                        ),
                        const SizedBox(width: 8),
                        Expanded(
                          child: _StatBox(
                            title: 'AVG',
                            value: avg,
                          ),
                        ),
                        const SizedBox(width: 8),
                        Expanded(
                          child: _StatBox(
                            title: 'MAX',
                            value: max,
                          ),
                        ),
                      ],
                    ),
                    const SizedBox(height: 14),
                    if (prices.isEmpty)
                      const Card(
                        child: Padding(
                          padding: EdgeInsets.all(20),
                          child: Text(
                            'Ҳоло нарх сабт нашудааст.',
                          ),
                        ),
                      ),
                    ...prices.asMap().entries.map(
                      (entry) {
                        final i = entry.key;
                        final item = entry.value;

                        return Card(
                          child: ListTile(
                            title: Text(
                              item['name'].toString(),
                              style: const TextStyle(
                                fontWeight: FontWeight.w800,
                              ),
                            ),
                            subtitle: Text(
                              '${item['city']} • ${item['unit']}',
                            ),
                            trailing: Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                Text(
                                  '${(item['price'] as num).toStringAsFixed(2)} с.',
                                  style: const TextStyle(
                                    fontWeight: FontWeight.w900,
                                  ),
                                ),
                                IconButton(
                                  onPressed: () {
                                    onDelete(i);
                                  },
                                  icon: const Icon(
                                    Icons.delete_outline,
                                  ),
                                ),
                              ],
                            ),
                          ),
                        );
                      },
                    ),
                    const SizedBox(height: 90),
                  ],
                ),
              );
            }
          }

